[package]
name = "prismae"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Drieh/Prisma"
description = "A simple GUI framework built with Rust and SDL3."
readme = "README.md"
keywords = ["gui", "framework", "sdl3", "rust", "2d"]
categories = ["gui"]
exclude = [
    "Cargo.lock",
]

[dependencies]
sdl3 = { version = "0.18.4", features = ["build-from-source"] }
sdl3-ttf-src = "3.2.2"
sdl3-ttf-sys = { version = "0.6.1", features = ["build-from-source"] }

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "drag"
path = "examples/drag.rs"